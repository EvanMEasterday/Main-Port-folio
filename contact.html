<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact</title>
<link rel="stylesheet" href="CSS/styles.css">
<script defer src="JS/script.js"></script>
</head>

<body>

<header>...</header>

<main>
  <h2>Contact Us</h2>

  <form id="contactForm">
    <label>Name:</label>
    <input type="text" required>

    <label>Email:</label>
    <input type="email" required>

    <label>Subject:</label>
    <input type="text" required>

    <label>Reason:</label>
    <select required>
      <option value="">Select</option>
      <option>General</option>
      <option>Feedback</option>
    </select>

    <label>Message:</label>
    <textarea required></textarea>

    <button type="submit">Submit</button>
  </form>

</main>

<footer>© 2026 Port-folio</footer>

</body>
</html>
